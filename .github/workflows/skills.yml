# Validates the agent skills (.claude/skills) and the artifacts they produce
# (docs/prd, docs/specs): Python test suites, Mermaid parser self-test, PRD,
# spec and tasks linters, the independence between skills, and the
# commit-message policy of pull requests. Everything runs from the repository
# root.
name: skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: .claude/skills/prd-writer/scripts/mermaid-parser/package-lock.json

      - name: Print tool versions
        run: |
          python3 --version
          node --version
          git --version

      - name: Install the pinned Mermaid parser (npm ci)
        run: python3 .claude/skills/prd-writer/scripts/lint_mermaid.py --setup

      - name: Mermaid parser self-test
        run: python3 .claude/skills/prd-writer/scripts/lint_mermaid.py --self-test

      - name: prd-writer test suite
        run: python3 -m unittest discover -s .claude/skills/prd-writer/scripts/tests -v

      - name: spec-driven test suite
        run: python3 -m unittest discover -s .claude/skills/spec-driven/scripts/tests -v

      - name: check_commit test suite (.github/scripts)
        run: python3 -m unittest discover -s .github/scripts/tests -v

      - name: No skipped tests (the parser is installed, so nothing may be skipped)
        run: |
          out=$(python3 -m unittest discover -s .claude/skills/prd-writer/scripts/tests 2>&1; python3 -m unittest discover -s .claude/skills/spec-driven/scripts/tests 2>&1; python3 -m unittest discover -s .github/scripts/tests 2>&1)
          echo "$out" | tail -n 8
          if echo "$out" | grep -q "skipped="; then echo "::error::test suite reported skipped tests"; exit 1; fi

      - name: Lint PRDs (docs/prd)
        run: |
          python3 .claude/skills/prd-writer/scripts/lint_prd.py docs/prd
          python3 .claude/skills/prd-writer/scripts/lint_mermaid.py docs/prd

      - name: Lint living specs (docs/specs/*/*/spec.md)
        run: |
          status=0
          [ -d docs/specs ] || { echo "no docs/specs"; exit 0; }
          for spec in $(find docs/specs -mindepth 3 -maxdepth 3 -name spec.md | sort); do
            python3 .claude/skills/spec-driven/scripts/lint_spec.py "$spec" || status=1
          done
          exit $status

      - name: Lint tasks against their living spec (docs/specs/*/*/*/tasks.md)
        run: |
          status=0
          [ -d docs/specs ] || { echo "no docs/specs"; exit 0; }
          for tasks in $(find docs/specs -mindepth 4 -maxdepth 4 -name tasks.md | sort); do
            spec="$(dirname "$tasks")/../spec.md"
            python3 .claude/skills/spec-driven/scripts/lint_tasks.py "$tasks" --spec "$spec" || status=1
          done
          exit $status

      - name: Skills are independent of each other (coupled only by the PRD artifact)
        run: |
          status=0
          # spec-driven: no mention of the other skill, its files, or files this skill no longer has;
          # its own name only in the SKILL.md frontmatter and title.
          hits=$(grep -rIiE "prd-writer|intake\.md|writing\.md|output\.md|review\.md|modes\.md|memory\.md" .claude/skills/spec-driven --exclude-dir=__pycache__ --exclude=test_docs_consistency.py || true)
          if [ -n "$hits" ]; then echo "$hits"; echo "::error::spec-driven cites another skill or a removed file"; status=1; fi
          hits=$(grep -rIiE "spec-driven" .claude/skills/spec-driven --exclude-dir=__pycache__ --exclude=test_docs_consistency.py | grep -vE "SKILL\.md:(name: spec-driven|# Spec-Driven Development)$" || true)
          if [ -n "$hits" ]; then echo "$hits"; echo "::error::spec-driven cites itself by name outside the SKILL.md frontmatter/title"; status=1; fi
          # prd-writer: no mention of the other skill; its own name only in the SKILL.md frontmatter.
          hits=$(grep -rIiE "spec-driven" .claude/skills/prd-writer --exclude-dir=__pycache__ --exclude-dir=node_modules || true)
          if [ -n "$hits" ]; then echo "$hits"; echo "::error::prd-writer cites spec-driven"; status=1; fi
          hits=$(grep -rIiE "prd-writer" .claude/skills/prd-writer --exclude-dir=__pycache__ --exclude-dir=node_modules | grep -vE "SKILL\.md:name: prd-writer$" || true)
          if [ -n "$hits" ]; then echo "$hits"; echo "::error::prd-writer cites itself by name outside the SKILL.md frontmatter"; status=1; fi
          # commit policy belongs to the repository: the spec-driven scripts know nothing about it.
          hits=$(grep -rIi "commit" .claude/skills/spec-driven/scripts --exclude-dir=__pycache__ --exclude-dir=tests || true)
          if [ -n "$hits" ]; then echo "$hits"; echo "::error::commit policy inside the spec-driven scripts"; status=1; fi
          exit $status

      - name: Commit messages follow CLAUDE.md (pull requests only)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            msg=$(git log -1 --format=%B "$sha")
            echo "== $sha: ${msg%%$'\n'*}"
            python3 .github/scripts/check_commit.py --message "$msg" \
              --max-len 60 --no-scope --no-bang --single-line --lowercase || status=1
          done
          exit $status
