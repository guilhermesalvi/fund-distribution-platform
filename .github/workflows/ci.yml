name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      # The AppHost uses the Aspire CLI bundle (AspireUseCliBundle=true); the integration tests need it to start the app.
      - run: curl -sSL https://aspire.dev/install.sh | bash -s -- --version 13.5.3
      - run: dotnet build FundDistributionPlatform.slnx
      - run: dotnet test FundDistributionPlatform.slnx

  publish-aot:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [Offering, BookBuilding]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet publish src/${{ matrix.project }}/${{ matrix.project }}.csproj -c Release -r linux-x64
