# Validates the agent skills (.claude/skills) and the artifacts they produce
# (docs/prd, docs/specs): Python test suites, Mermaid parser self-test, PRD,
# spec, design and tasks linters, the independence between skills, and the
# commit-message policy of pull requests. Everything runs from the repository
# root.
name: skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: .claude/skills/prd/scripts/mermaid-parser/package-lock.json

      - name: Print tool versions
        run: |
          python3 --version
          node --version
          git --version

      - name: Install the pinned Mermaid parser (npm ci)
        run: python3 .claude/skills/prd/scripts/lint_mermaid.py --setup

      - name: Mermaid parser self-test
        run: python3 .claude/skills/prd/scripts/lint_mermaid.py --self-test

      - name: prd test suite
        run: python3 -m unittest discover -s .claude/skills/prd/scripts/tests -v

      - name: sdd test suite
        run: python3 -m unittest discover -s .claude/skills/sdd/scripts/tests -v

      - name: check_commit test suite (.github/scripts)
        run: python3 -m unittest discover -s .github/scripts/tests -v

      - name: No skipped tests (the parser is installed, so nothing may be skipped)
        run: |
          out=$(python3 -m unittest discover -s .claude/skills/prd/scripts/tests 2>&1; python3 -m unittest discover -s .claude/skills/sdd/scripts/tests 2>&1; python3 -m unittest discover -s .github/scripts/tests 2>&1)
          echo "$out" | tail -n 8
          if echo "$out" | grep -q "skipped="; then echo "::error::test suite reported skipped tests"; exit 1; fi

      - name: Lint PRDs (docs/prd)
        run: |
          python3 .claude/skills/prd/scripts/seq.py check docs/prd
          python3 .claude/skills/prd/scripts/lint_prd.py docs/prd
          python3 .claude/skills/prd/scripts/lint_mermaid.py docs/prd

      - name: Lint living specs (docs/specs/*/*/spec.md)
        run: |
          status=0
          [ -d docs/specs ] || { echo "no docs/specs"; exit 0; }
          for spec in $(find docs/specs -mindepth 3 -maxdepth 3 -name spec.md | sort); do
            python3 .claude/skills/sdd/scripts/seq.py check "$(dirname "$spec")" || status=1
            python3 .claude/skills/sdd/scripts/lint_spec.py "$spec" || status=1
          done
          [ -d docs/adr ] && { python3 .claude/skills/sdd/scripts/seq.py check docs/adr || status=1; }
          exit $status

      - name: Lint design and tasks against their living spec (docs/specs/*/*/*)
        run: |
          status=0
          [ -d docs/specs ] || { echo "no docs/specs"; exit 0; }
          for design in $(find docs/specs -mindepth 4 -maxdepth 4 -name design.md | sort); do
            spec="$(dirname "$design")/../spec.md"
            python3 .claude/skills/sdd/scripts/lint_design.py "$design" --spec "$spec" || status=1
          done
          for tasks in $(find docs/specs -mindepth 4 -maxdepth 4 -name tasks.md | sort); do
            spec="$(dirname "$tasks")/../spec.md"
            python3 .claude/skills/sdd/scripts/lint_tasks.py "$tasks" --spec "$spec" || status=1
          done
          exit $status

      - name: Skills are independent of each other (coupled only by the PRD artifact)
        run: |
          status=0
          # sdd: no mention of the other skill (by path: "prd" alone is the artifact, not the skill), its files,
          # or files this skill no longer has; itself never by path.
          hits=$(grep -rIiE "skills/prd\b|intake\.md|writing\.md|output\.md|review\.md|modes\.md|memory\.md" .claude/skills/sdd --exclude-dir=__pycache__ --exclude=test_docs_consistency.py || true)
          if [ -n "$hits" ]; then echo "$hits"; echo "::error::sdd cites another skill or a removed file"; status=1; fi
          hits=$(grep -rIiE "skills/sdd\b" .claude/skills/sdd --exclude-dir=__pycache__ --exclude=test_docs_consistency.py || true)
          if [ -n "$hits" ]; then echo "$hits"; echo "::error::sdd cites itself by path"; status=1; fi
          # prd: no mention of the other skill, its files or its artifacts; itself never by path
          # (the npm package name under mermaid-parser is not a skill citation).
          hits=$(grep -rIiE "skills/sdd\b|specify\.md|design\.md|memory\.md|/docs/specs|prd-rev" .claude/skills/prd --exclude-dir=__pycache__ --exclude-dir=node_modules || true)
          if [ -n "$hits" ]; then echo "$hits"; echo "::error::prd cites sdd or its artifacts"; status=1; fi
          hits=$(grep -rIiE "skills/prd\b" .claude/skills/prd --exclude-dir=__pycache__ --exclude-dir=node_modules --exclude-dir=mermaid-parser || true)
          if [ -n "$hits" ]; then echo "$hits"; echo "::error::prd cites itself by path"; status=1; fi
          # commit policy belongs to the repository: the sdd scripts know nothing about it.
          hits=$(grep -rIi "commit" .claude/skills/sdd/scripts --exclude-dir=__pycache__ --exclude-dir=tests || true)
          if [ -n "$hits" ]; then echo "$hits"; echo "::error::commit policy inside the sdd scripts"; status=1; fi
          exit $status

      - name: Commit messages follow CLAUDE.md (pull requests only)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            msg=$(git log -1 --format=%B "$sha")
            echo "== $sha: ${msg%%$'\n'*}"
            python3 .github/scripts/check_commit.py --message "$msg" \
              --max-len 60 --no-scope --no-bang --single-line --lowercase || status=1
          done
          exit $status
