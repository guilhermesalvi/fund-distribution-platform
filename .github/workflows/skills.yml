# Validates the agent skills (.claude/skills) and the artifacts they produce
# (docs/prd, docs/specs, docs/adr) through the deterministic skills gate
# (.github/scripts/skills_gate.py: test suites, Mermaid self-tests, linters,
# independence between skills, encoding, .slnx and README registration), plus the
# commit-message policy of pull requests. Everything runs from the repository
# root. The LLM review stage of the gate is described in .claude/skills/GATE.md.
name: skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            .claude/skills/prd/scripts/mermaid-parser/package-lock.json
            .claude/skills/sdd/scripts/mermaid-parser/package-lock.json

      - name: Print tool versions
        run: |
          python3 --version
          node --version
          git --version

      - name: Install the pinned Mermaid parser of each skill (npm ci)
        run: |
          python3 .claude/skills/prd/scripts/lint_mermaid.py --setup
          python3 .claude/skills/sdd/scripts/lint_mermaid.py --setup

      - name: Skills gate (.github/scripts/skills_gate.py, the same list as .claude/skills/GATE.md)
        run: python3 .github/scripts/skills_gate.py

      - name: Commit messages follow CLAUDE.md (pull requests only)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            msg=$(git log -1 --format=%B "$sha")
            echo "== $sha: ${msg%%$'\n'*}"
            python3 .github/scripts/check_commit.py --message "$msg" \
              --max-len 60 --no-scope --no-bang --single-line --lowercase || status=1
          done
          exit $status
